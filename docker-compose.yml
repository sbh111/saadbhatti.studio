# Local development services.
# Usage:  docker compose up -d                       Postgres only (day-to-day)
#         docker compose down                        stop
#         docker compose down -v                     stop + wipe data
#         docker compose --profile streaming up -d   + Kafka + collector (K1)
#         docker compose --profile embedding up -d embed   CLIP embedder (on-demand)
#
# The `db` service has no profile, so it always runs. Kafka + the collector are
# behind the `streaming` profile, and the CLIP embedder is behind `embedding`, so
# ordinary development never starts any of them.
services:
  db:
    # pgvector/pgvector:pg16, NOT plain postgres:16-alpine (tech debt 1.2):
    # migration 5 runs `CREATE EXTENSION IF NOT EXISTS vector` for the CLIP
    # search feature, and the vanilla Postgres image doesn't ship that
    # extension at all — `npx prisma migrate dev` fails there with
    # `extension "vector" is not available`. This image is itself just the
    # official postgres:16 (Debian, not alpine) with pgvector built in, so the
    # PGDATA default/env vars/healthcheck below are unchanged. See the
    # README's "Local database" section if you have an EXISTING volume that
    # predates this switch.
    image: pgvector/pgvector:pg16
    container_name: sbh-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbh
      POSTGRES_PASSWORD: sbh_local_dev # local-only; never a real secret
      POSTGRES_DB: sbh_studio
    ports:
      - "5432:5432"
    volumes:
      - sbh_studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbh -d sbh_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Event streaming (Kafka learning phase) — profile "streaming" only ------
  # Single-node Kafka in KRaft mode (no ZooKeeper). 9092 is NOT published to the
  # host — the broker is reachable only from inside the compose network (the
  # collector), mirroring prod where the security group keeps 9092 closed. To
  # peek at the stream, exec a console consumer INSIDE the container (see README).
  kafka:
    image: confluentinc/cp-kafka:7.8.1
    container_name: sbh-studio-kafka
    profiles: ["streaming"]
    restart: unless-stopped
    environment:
      # Fixed cluster id so re-creates reuse the same formatted volume.
      CLUSTER_ID: sbh-studio-kafka-local
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # convenience for K1
      KAFKA_LOG_RETENTION_HOURS: 168 # ~7 days
      # Matches the K2 free-tier heap pin, so local behaves like the EC2 box.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - sbh_studio_kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  # The HTTP collector: the only door in. It authenticates (bearer token) and
  # produces to Kafka on the private network. Its port IS published so the Next
  # dev server on the host can POST to http://localhost:8000/events.
  collector:
    build: ./collector
    container_name: sbh-studio-collector
    profiles: ["streaming"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: web.events.v1
      # Local-only shared secret; must match EVENT_INGEST_TOKEN in .env.local.
      # Override by exporting EVENT_INGEST_TOKEN (compose reads .env, not .env.local).
      EVENT_INGEST_TOKEN: ${EVENT_INGEST_TOKEN:-sbh_local_ingest}
    ports:
      - "8000:8000"

  # --- Image-search embeddings (CLIP) — profile "embedding" only -------------
  # On-demand, local, no cloud instance. Spin up, probe to refresh vectors, tear
  # down:
  #   docker compose --profile embedding up -d embed
  #   curl -XPOST localhost:8100/reindex -H "Authorization: Bearer $EMBED_TOKEN"
  #   docker compose down
  # Pre-trained CLIP ViT-B/32 weights are baked into the image (same variant the
  # site's JS query encoder uses — model parity). Reads the artwork id list from
  # the deployed site's /api/catalog-index endpoint (bearer-token authed, not
  # under /api/admin — a container has no browser session cookie to send) and
  # writes vectors to Postgres.
  #
  # BOTH env vars below default LOCAL, deliberately — plain `docker compose
  # --profile embedding up` must never touch production by accident. A real
  # refresh (docs/operations.md §1) is an explicit opt-in: override BOTH
  # CATALOG_INDEX_URL and EMBED_DATABASE_URL together. A local catalog against
  # the production DB (or vice versa) is a legitimate thing to do on purpose —
  # there's one Cloudinary cloud either way — so nothing here refuses a "mixed"
  # combination; /reindex just logs and echoes back the two hosts it resolved
  # so a mismatch is visible instead of silent (see embed/main.py).
  embed:
    build: ./embed
    container_name: sbh-studio-embed
    profiles: ["embedding"]
    # Host networking, deliberately: this is a local, on-demand tool that has to
    # reach BOTH a dev site on the host and the outside world. On a bridge network,
    # Docker 28+/29 blocks container→host traffic by default, so the gateway IP
    # times out (and host.docker.internal resolves to the docker0 gateway, which is
    # not this container's gateway at all). Sharing the host namespace sidesteps
    # both: the site is plain localhost, and uvicorn's 8100 binds straight onto the
    # host (so `ports:` is unnecessary — and would be ignored — here).
    network_mode: host
    environment:
      EMBED_TOKEN: ${EMBED_TOKEN:-sbh_local_embed} # local-only default; override in prod
      # Artwork id source + its bearer. Local default: with host networking, a
      # local dev site is just http://localhost:3000/api/catalog-index. For a
      # PRODUCTION refresh, override to the CANONICAL host (www): the apex
      # 308-redirects to www, and httpx drops the Authorization header across
      # an origin change. Same fact as SITE_ORIGIN in lib/constants.ts, which
      # the Next app reads from — this file can't import it, so keep the host
      # in sync by hand: https://www.saadbhatti.studio/api/catalog-index
      CATALOG_INDEX_URL: ${CATALOG_INDEX_URL:-http://localhost:3000/api/catalog-index}
      CATALOG_INDEX_TOKEN: ${CATALOG_INDEX_TOKEN:-}
      # Local default: the compose db container, via its published port (host
      # networking means the compose service name `db` does not resolve here).
      # For a PRODUCTION refresh, override to the DIRECT (non-pooled) Neon URL.
      EMBED_DATABASE_URL: ${EMBED_DATABASE_URL:-postgresql://sbh:sbh_local_dev@localhost:5432/sbh_studio}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-sbh111}

volumes:
  sbh_studio_pgdata:
  sbh_studio_kafka:
